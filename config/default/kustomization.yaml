# config/default is two stacks side by side:
#   controller/  the controller, with namespace kuberik-system and namePrefix rollout-controller-
#   ../admission the admission policies and the approver ClusterRole, deliberately
#                NOT prefixed: the dashboard looks up the binding
#                kuberik-rolloutapproval-by and teams bind kuberik-rollout-approver
#                by those exact names.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - controller
  - ../admission
