apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: my-app-kustomization
  namespace: default
  annotations:
    rollout.kuberik.com/substitute.frontend_version.from: "frontend-rollout"
    rollout.kuberik.com/substitute.backend_version.from: "backend-rollout"
    rollout.kuberik.com/substitute.api_version.from: "api-rollout"
spec:
  interval: 1m0s
  path: ./kustomize
  prune: true
  sourceRef:
    kind: GitRepository
    name: my-app-repo
  postBuild:
    substitute:
      # frontend_version, backend_version and api_version are written by their rollouts.
      # Do not set them here; use ${frontend_version:=1.0.0} defaults in the manifests.
      environment: production
