---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - '*'
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - '*'
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kuberik.com
  resources:
  - approvalpolicies
  - clusterapprovalpolicies
  - releaseslices
  - releasesources
  - rolloutapprovals
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kuberik.com
  resources:
  - approvalpolicies/finalizers
  - clusterapprovalpolicies/finalizers
  - clusterrolloutschedules/finalizers
  - healthchecks/finalizers
  - kustomizationhealths/finalizers
  - rolloutdependencies/finalizers
  - rollouts/finalizers
  - rolloutschedules/finalizers
  verbs:
  - update
- apiGroups:
  - kuberik.com
  resources:
  - approvalpolicies/status
  - clusterapprovalpolicies/status
  - clusterrolloutschedules/status
  - healthchecks/status
  - kustomizationhealths/status
  - rolloutdependencies/status
  - rollouts/status
  - rolloutschedules/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - kuberik.com
  resources:
  - clusterrolloutschedules
  - healthchecks
  - kustomizationhealths
  - rolloutdependencies
  - rolloutgates
  - rollouts
  - rolloutschedules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kustomize.toolkit.fluxcd.io
  resources:
  - kustomizations
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - ocirepositories
  verbs:
  - get
  - list
  - patch
  - update
  - watch
