run:
  timeout: 5m
  allow-parallel-runners: true

issues:
  # don't skip warning about doc comments
  # don't exclude the default set of lint
  exclude-use-default: false
  # restore some of the defaults
  # (fill in the rest as needed)
  exclude-rules:
    - path: "api/*"
      linters:
        - lll
    - path: "internal/*"
      linters:
        - dupl
        - lll
    # Known-large reconcile paths in rollout_controller.go. Splitting them is a
    # behavioural refactor that deserves its own change; the threshold stays at
    # the default 30 for every other function. Remove an entry once its
    # function is split up.
    - path: internal/controller/rollout_controller\.go
      linters:
        - gocyclo
      text: "of func `\\(\\*RolloutReconciler\\)\\.(Reconcile|deployRelease|parseOCIManifest|handleBakeTime)` is high"
linters:
  disable-all: true
  enable:
    - dupl
    - errcheck
    - copyloopvar
    - ginkgolinter
    - goconst
    - gocyclo
    - gofmt
    - goimports
    - gosimple
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - typecheck
    - unconvert
    - unparam
    - unused

linters-settings:
  revive:
    rules:
      - name: comment-spacings
